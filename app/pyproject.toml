[project]
name = "atm"
version = "0.1.0"
description = "AI Terminal Manager — 跨 agent 的统一会话历史，投递到指定 tmux pane"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# 刻意保持零运行时依赖：atm 要在 tmux display-popup 里被反复冷启动，
# 任何 import 开销都会让「唤出侧栏」这个手势变卡。stdlib 够用。
dependencies = []

[project.scripts]
atm = "atm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atm"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PTH"]
ignore = [
    "RUF001", # 全角标点在中文注释里是正常的
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
